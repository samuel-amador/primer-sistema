<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartel</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .cartel {
            width: 500px;
            padding: 40px;
            text-align: center;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .cartel h1 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .cartel h2 {
            font-size: 25px;
            margin-bottom: 20px;
        }

        .cartel p {
            font-size: 18px;
            line-height: 1.6;
        }

        .boton {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: white;
            color: #0077b6;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
        }

        .boton:hover {
            background: #caf0f8;
        }
    </style>
</head>

<body>

    <div class="cartel">
        <h1>¡BIENVENIDO!</h1>

        <h2>SISTEMA WEB</h2>

        <p>
            Gracias por su preferencia de ver mi sistema
        </p>

        <p>
            Atención organizada, rápida y segura.
        </p>

        <a href="#" class="boton">INGRESAR</a>
    </div>

</body>
</html>
